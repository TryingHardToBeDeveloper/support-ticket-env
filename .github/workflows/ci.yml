name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,server]"
      - run: python -m pytest
      - run: python -m ruff check __init__.py client.py models.py graders.py client_package server tests
      - run: python -m ruff format --check __init__.py client.py models.py graders.py client_package server tests
      - run: python -m mypy client_package/support_ticket_env graders.py server/security.py server/support_environment.py
      - run: python -m build
      - name: Verify client wheel excludes server answers
        shell: python
        run: |
          import glob, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          with zipfile.ZipFile(wheel) as archive:
              names = archive.namelist()
          assert not any("server/ticket_bank.py" in name for name in names), names
