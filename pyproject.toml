[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "support-ticket-env"
version = "1.0.0"
description = "Customer Support Ticket Resolution — OpenEnv Environment"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "openenv-core>=0.2.2",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pyyaml>=6.0",
    "gradio>=4.0.0",
]
baseline = ["openai>=1.0.0"]
dev = [
    "build>=1.2",
    "httpx>=0.27",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[tool.setuptools]
packages = ["support_ticket_env"]
package-dir = {support_ticket_env = "client_package/support_ticket_env"}

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["*.ipynb", "openenv_stub"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"server/ticket_bank.py" = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
explicit_package_bases = true
exclude = "(openenv_stub|.*\\.ipynb)"
